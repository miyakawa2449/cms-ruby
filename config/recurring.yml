production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Weekly security report (Phase 7.4)
  weekly_security_report:
    class: "Security::WeeklyReportJob"
    queue: default
    schedule: every monday at 10:00 Asia/Tokyo
    description: "Generate and send weekly security report"

  # Backup jobs (Phase 7.3)
  daily_backup:
    class: "Backup::DailyBackupJob"
    queue: backup
    schedule: every day at 2:00 Asia/Tokyo

  weekly_backup:
    class: "Backup::WeeklyBackupJob"
    queue: backup
    schedule: every sunday at 3:00 Asia/Tokyo

  monthly_backup:
    class: "Backup::MonthlyBackupJob"
    queue: backup
    schedule: "0 4 1 * * Asia/Tokyo"
