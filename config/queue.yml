# Solid Queueのプロセス構成。
# 定期実行ジョブ（バックアップ・予約投稿等）はここではなく config/recurring.yml で管理する。
# （Solid Queue 1.xはdispatcherのrecurring_tasksを読まないため、二重定義を防ぐ目的でも一本化）
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
