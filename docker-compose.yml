version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio_development
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=ja_JP.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tmp/db:/tmp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev.simple
    command: bundle exec rails server -b 0.0.0.0
    environment:
      DATABASE_URL: "postgresql://portfolio:portfolio_password@db:5432/portfolio_development"
      REDIS_URL: "redis://redis:6379/0"
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      BUNDLE_PATH: /bundle
      WEBPACKER_DEV_SERVER_HOST: webpacker
      HISTFILE: /app/.bash_history
      EDITOR: vim
    volumes:
      - .:/app:cached
      - bundle_data:/bundle
      - node_modules:/app/node_modules
      - rails_cache:/app/tmp/cache
      - ./log:/app/log
      - bash_history:/app/.bash_history
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true
    tmpfs:
      - /tmp

  # Sidekiq（バックグラウンドジョブ）
  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile.dev.simple
    command: bundle exec sidekiq
    environment:
      DATABASE_URL: "postgresql://portfolio:portfolio_password@db:5432/portfolio_development"
      REDIS_URL: "redis://redis:6379/0"
      RAILS_ENV: development
      BUNDLE_PATH: /bundle
    volumes:
      - .:/app:cached
      - bundle_data:/bundle
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Webpacker Dev Server（必要に応じて）
  webpacker:
    build:
      context: .
      dockerfile: Dockerfile.dev.simple
    command: ./bin/webpack-dev-server
    environment:
      NODE_ENV: development
      RAILS_ENV: development
      WEBPACKER_DEV_SERVER_HOST: 0.0.0.0
    volumes:
      - .:/app:cached
      - bundle_data:/bundle
      - node_modules:/app/node_modules
    ports:
      - "3035:3035"
    depends_on:
      - web

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  bundle_data:
    driver: local
  node_modules:
    driver: local
  rails_cache:
    driver: local
  bash_history:
    driver: local