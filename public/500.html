<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>サーバーエラー - Miyakawa Codes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Noto Sans JP', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        color: #e2e8f0;
        padding: 1.5rem;
      }

      .container {
        text-align: center;
        max-width: 500px;
      }

      .error-code {
        font-size: clamp(6rem, 20vw, 10rem);
        font-weight: 700;
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 1rem;
      }

      .error-title {
        font-size: clamp(1.25rem, 4vw, 1.75rem);
        font-weight: 600;
        margin-bottom: 1rem;
        color: #f1f5f9;
      }

      .error-message {
        font-size: 1rem;
        color: #94a3b8;
        margin-bottom: 2.5rem;
        line-height: 1.7;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
      }

      @media (min-width: 480px) {
        .links {
          flex-direction: row;
          justify-content: center;
        }
      }

      .link-primary {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.875rem 1.75rem;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: #fff;
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.2s ease;
        box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
      }

      .link-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
      }

      .link-secondary {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.875rem 1.75rem;
        background: rgba(255, 255, 255, 0.1);
        color: #e2e8f0;
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.2s ease;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .link-secondary:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .icon {
        width: 1.25rem;
        height: 1.25rem;
      }

      .decoration {
        position: fixed;
        border-radius: 50%;
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        opacity: 0.08;
        pointer-events: none;
      }

      .decoration-1 {
        width: 300px;
        height: 300px;
        top: -100px;
        right: -100px;
      }

      .decoration-2 {
        width: 200px;
        height: 200px;
        bottom: -50px;
        left: -50px;
      }

      .retry-note {
        font-size: 0.875rem;
        color: #64748b;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <div class="container">
      <div class="error-code">500</div>
      <h1 class="error-title">サーバーエラーが発生しました</h1>
      <p class="error-message">
        申し訳ございません。サーバー側で問題が発生しました。<br>
        しばらく時間をおいてから、再度お試しください。
      </p>
      <div class="links">
        <a href="/" class="link-primary">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          トップページへ
        </a>
        <a href="javascript:location.reload()" class="link-secondary">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          再読み込み
        </a>
      </div>
      <p class="retry-note">問題が続く場合は、管理者にお問い合わせください。</p>
    </div>
  </body>
</html>
