services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio_rb_development
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale-provider=icu --icu-locale=ja-JP"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tmp/db:/tmp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev.simple
    command: bundle exec rails server -b 0.0.0.0 -p 3000
    environment:
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      DATABASE_URL: "postgresql://portfolio:portfolio_password@db:5432/portfolio_rb_development"
      REDIS_URL: "redis://redis:6379/0"
      BUNDLE_PATH: /bundle
    volumes:
      - .:/app:cached
      - bundle_data:/bundle
      - node_modules:/app/node_modules
      - rails_cache:/app/tmp/cache
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile.dev.simple
    command: bundle exec sidekiq
    environment:
      RAILS_ENV: development
      DATABASE_URL: "postgresql://portfolio:portfolio_password@db:5432/portfolio_rb_development"
      REDIS_URL: "redis://redis:6379/0"
      BUNDLE_PATH: /bundle
    volumes:
      - .:/app:cached
      - bundle_data:/bundle
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  css:
    build:
      context: .
      dockerfile: Dockerfile.dev.simple
    command: yarn build:css --watch
    environment:
      NODE_ENV: development
      RAILS_ENV: development
    volumes:
      - .:/app:cached
      - node_modules:/app/node_modules
    depends_on:
      - web

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  bundle_data:
    driver: local
  node_modules:
    driver: local
  rails_cache:
    driver: local