services:
  portfolio-db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: portfolio_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  portfolio-web:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    depends_on:
      - portfolio-db
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD}@portfolio-db:5432/portfolio_production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: true
      RAILS_SERVE_STATIC_FILES: true
    volumes:
      - storage_data:/rails/storage
      - log_data:/rails/log
      - tmp_data:/rails/tmp
    networks:
      - app-network
    ports:
      - "3000:80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - portfolio-web
    volumes:
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  storage_data:
  log_data:
  tmp_data:

networks:
  app-network:
    driver: bridge