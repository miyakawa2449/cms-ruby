<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - CMS管理画面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        .login-gradient {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        }
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .login-button {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transition: all 0.3s ease;
        }
        .login-button:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }
        .login-card {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.95);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body class="login-gradient min-h-screen flex items-center justify-center p-4">
    
    <!-- ログインカード -->
    <div class="login-card w-full max-w-md rounded-2xl shadow-2xl p-8 animate-fadeIn">
        <!-- ロゴ -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4">
                <span class="text-white font-bold text-2xl">M</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">管理画面ログイン</h1>
            <p class="text-sm text-gray-600 mt-1">Miyakawa Codes CMS</p>
        </div>

        <!-- エラーメッセージ（ログイン失敗時表示） -->
        <div class="hidden mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 text-red-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p class="text-sm text-red-600">メールアドレスまたはパスワードが正しくありません。</p>
            </div>
            <p class="text-xs text-red-500 mt-1 ml-7">残り試行回数: 3回</p>
        </div>

        <!-- ログインフォーム -->
        <form action="#" method="POST">
            <div class="space-y-4">
                <!-- メールアドレス -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                        メールアドレス
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="admin@example.com"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 input-focus transition-colors"
                        required
                    >
                </div>

                <!-- パスワード -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="password" class="block text-sm font-medium text-gray-700">
                            パスワード
                        </label>
                        <a href="#" class="text-sm text-blue-600 hover:text-blue-700 hover:underline">
                            パスワードをお忘れですか？
                        </a>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 input-focus transition-colors"
                        required
                    >
                </div>

                <!-- ログイン状態を保持 -->
                <div class="flex items-center">
                    <input 
                        type="checkbox" 
                        id="remember" 
                        name="remember" 
                        class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                    >
                    <label for="remember" class="ml-2 text-sm text-gray-700">
                        ログイン状態を保持する
                    </label>
                </div>
            </div>

            <!-- ログインボタン -->
            <button 
                type="submit" 
                class="login-button w-full mt-6 py-3 text-white font-semibold rounded-lg"
            >
                ログイン
            </button>
        </form>

        <!-- アカウントロック警告（5回失敗後） -->
        <div class="hidden mt-6 p-4 bg-amber-50 border border-amber-200 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 text-amber-600 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m0 0v2m0-2h2m-2 0h-2m8-6V7a4 4 0 00-8 0v2m8 0H4"></path>
                </svg>
                <div>
                    <p class="text-sm text-amber-700 font-semibold">アカウントがロックされました</p>
                    <p class="text-xs text-amber-600 mt-1">セキュリティのため、30分後に再度お試しください。</p>
                </div>
            </div>
        </div>

        <!-- セキュリティ情報 -->
        <div class="mt-8 pt-6 border-t border-gray-200">
            <div class="flex items-center justify-center text-xs text-gray-500 space-x-4">
                <div class="flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                    SSL暗号化通信
                </div>
                <div class="flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                    セキュリティ保護
                </div>
            </div>
        </div>
    </div>

    <!-- フッター -->
    <div class="absolute bottom-4 left-0 right-0 text-center">
        <p class="text-xs text-slate-300">
            © 2024 Miyakawa Codes. All rights reserved.
        </p>
    </div>

    <!-- デモ用JavaScript（実際の実装では削除） -->
    <script>
        // フォーム送信のデモ
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // ログインボタンをローディング状態に
            const button = e.target.querySelector('button[type="submit"]');
            const originalText = button.textContent;
            button.textContent = 'ログイン中...';
            button.disabled = true;
            button.style.opacity = '0.7';
            
            // 2秒後に元に戻す（実際の実装では認証処理後）
            setTimeout(() => {
                button.textContent = originalText;
                button.disabled = false;
                button.style.opacity = '1';
                alert('デモ: ログイン処理を実行します');
            }, 2000);
        });

        // パスワード表示/非表示トグル（将来的に実装可能）
        // const togglePassword = document.querySelector('#togglePassword');
        // const password = document.querySelector('#password');
        // togglePassword.addEventListener('click', function() {
        //     const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        //     password.setAttribute('type', type);
        //     this.classList.toggle('text-gray-700');
        // });
    </script>
</body>
</html>
