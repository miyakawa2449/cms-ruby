<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="60">
    <title>メンテナンス中 - Miyakawa Codes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Noto Sans JP', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        color: #e2e8f0;
        padding: 1.5rem;
      }

      .container {
        text-align: center;
        max-width: 520px;
      }

      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.5rem;
        color: #38bdf8;
      }

      .title {
        font-size: clamp(1.5rem, 5vw, 2rem);
        font-weight: 700;
        margin-bottom: 1rem;
        color: #f1f5f9;
      }

      .message {
        font-size: 1rem;
        color: #94a3b8;
        margin-bottom: 1rem;
        line-height: 1.8;
      }

      .message-en {
        font-size: 0.9rem;
        color: #64748b;
        line-height: 1.7;
        margin-bottom: 2.5rem;
      }

      .note {
        font-size: 0.8rem;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      <h1 class="title">ただいまメンテナンス中です</h1>
      <p class="message">
        サーバーの更新作業を行っています。<br>
        数分ほどで復旧する見込みです。しばらくしてから再度アクセスしてください。
      </p>
      <p class="message-en">
        The site is temporarily down for maintenance.<br>
        We expect to be back within a few minutes. Thank you for your patience.
      </p>
      <p class="note">このページは60秒ごとに自動で再読み込みされます。</p>
    </main>
  </body>
</html>
