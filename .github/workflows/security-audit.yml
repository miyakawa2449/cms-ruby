name: Security Audit

on:
  schedule:
    # Run daily at 3:00 AM JST (18:00 UTC)
    - cron: '0 18 * * *'
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  brakeman:
    name: Brakeman Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true

      - name: Run Brakeman
        run: |
          bundle exec brakeman -o brakeman-report.json -o brakeman-report.html --no-pager

      - name: Upload Brakeman results
        uses: actions/upload-artifact@v4
        with:
          name: brakeman-results
          path: brakeman-report.*
          retention-days: 30

      - name: Check for high severity issues
        id: check_issues
        run: |
          if [ -f brakeman-report.json ]; then
            HIGH_COUNT=$(cat brakeman-report.json | jq '.warnings | map(select(.confidence == "High")) | length')
            echo "high_count=$HIGH_COUNT" >> $GITHUB_OUTPUT
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "Found $HIGH_COUNT high confidence issues"
              exit 1
            fi
          fi

      - name: Notify on vulnerabilities
        if: failure() && env.RAILS_WEBHOOK_URL != ''
        env:
          RAILS_WEBHOOK_URL: ${{ secrets.RAILS_WEBHOOK_URL }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          if [ -f brakeman-report.json ]; then
            curl -X POST "$RAILS_WEBHOOK_URL/api/internal/security/brakeman" \
              -H "Authorization: Bearer $INTERNAL_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d @brakeman-report.json || true
          fi

  bundler-audit:
    name: Bundler Audit Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true

      - name: Update bundler-audit database
        run: bundle exec bundler-audit update

      - name: Run bundler-audit
        id: audit
        run: |
          bundle exec bundler-audit check --format json > bundler-audit-report.json 2>&1 || true
          # Check if there are any vulnerabilities
          if [ -s bundler-audit-report.json ]; then
            VULN_COUNT=$(cat bundler-audit-report.json | jq '.results | length' 2>/dev/null || echo "0")
            echo "vulnerability_count=$VULN_COUNT" >> $GITHUB_OUTPUT
            if [ "$VULN_COUNT" -gt 0 ]; then
              echo "Found $VULN_COUNT vulnerable gems"
              cat bundler-audit-report.json
            fi
          fi

      - name: Upload bundler-audit results
        uses: actions/upload-artifact@v4
        with:
          name: bundler-audit-results
          path: bundler-audit-report.json
          retention-days: 30

      - name: Notify on vulnerabilities
        if: steps.audit.outputs.vulnerability_count > 0 && env.RAILS_WEBHOOK_URL != ''
        env:
          RAILS_WEBHOOK_URL: ${{ secrets.RAILS_WEBHOOK_URL }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          curl -X POST "$RAILS_WEBHOOK_URL/api/internal/security/bundler_audit" \
            -H "Authorization: Bearer $INTERNAL_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d @bundler-audit-report.json || true

  summary:
    name: Security Audit Summary
    runs-on: ubuntu-latest
    needs: [brakeman, bundler-audit]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Brakeman: ${{ needs.brakeman.result }}"
          echo "Bundler Audit: ${{ needs.bundler-audit.result }}"

          if [ "${{ needs.brakeman.result }}" == "failure" ] || [ "${{ needs.bundler-audit.result }}" == "failure" ]; then
            echo "Security audit found issues - please review"
            exit 1
          fi
          echo "Security audit passed"
