server {
    listen 80;
    server_name miyakawa.codes;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ----- Maintenance mode -----
    # 手動切り替え: サーバー上で `touch nginx/maintenance/on` で ON、`rm nginx/maintenance/on` で OFF
    # （nginx の reload は不要）。Rails (portfolio-web) が停止中は自動で同じ画面を 503 で返す。
    set $maintenance 0;
    if (-f /usr/share/nginx/maintenance/on) {
        set $maintenance 1;
    }
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /maintenance.html;

    location = /maintenance.html {
        internal;
        root /usr/share/nginx/maintenance;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        if ($maintenance) {
            return 503;
        }

        proxy_pass http://portfolio-web:80;
        proxy_set_header Host miyakawa.codes;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host miyakawa.codes;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Static files with cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        if ($maintenance) {
            return 503;
        }

        proxy_pass http://portfolio-web:80;
        proxy_set_header Host miyakawa.codes;
        proxy_set_header X-Forwarded-Host miyakawa.codes;
        proxy_set_header X-Forwarded-Proto https;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://portfolio-web:80/health;
        proxy_set_header Host miyakawa.codes;
        proxy_set_header X-Forwarded-Host miyakawa.codes;
        proxy_set_header X-Forwarded-Proto https;
    }
}
